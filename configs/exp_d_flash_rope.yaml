# ------------------------------------------------------------------
# EXPERIMENT D - Flash/fused attention + RoPE. The full modern stack:
# rotation positions + fused attention kernels.
# ------------------------------------------------------------------
experiment: D
label: "Flash + RoPE"

# ---- THE two experimental variables (only these differ A/B/C/D) ----
attention: flash_fused
position: rope
rope_base: 10000.0
flash_tile_size: 64

# ---- Study B/C variables held at the canonical baseline -------------
activation: gelu             # B1 baseline; varies only in the B series
swiglu_matched: true        # SwiGLU fairness: param-matched width
optimizer: adamw             # C2 baseline; varies only in the C series

# ---- shared training recipe (identical across experiments) ---------
dropout: 0.0
bias: true
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
warmup_steps: 100
decay_steps: null
eval_interval: 100
eval_iters: 20
checkpoint_interval: 500
sample_interval: 500
seed: 42
