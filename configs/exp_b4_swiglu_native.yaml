# ------------------------------------------------------------------
# STUDY B4b - SwiGLU FFN, ARCHITECTURE-NATIVE interpretation.
# Conventional LLaMA-style width h = 4n: the gated FFN carries ~1.5x
# the FFN weights of GELU. Fairness rule (ABLATION_PLAN section 5),
# interpretation 2: this answers what native SwiGLU costs and wins -
# compare its quality AND its parameter bill against B1 and B4a.
# ------------------------------------------------------------------
experiment: B4b
label: "SwiGLU (architecture-native)"

# ---- Study A variables held at the canonical baseline ---------------
attention: vanilla
position: learned

# ---- Study B variable ------------------------------------------------
activation: swiglu
swiglu_matched: false

# ---- Study C variable held at the canonical baseline -----------------
optimizer: adamw

# ---- shared training recipe (identical across all experiments) --------
dropout: 0.0
bias: true
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
warmup_steps: 100
decay_steps: null
eval_interval: 100
eval_iters: 20
checkpoint_interval: 500
sample_interval: 500
seed: 42
