# ------------------------------------------------------------------
# STUDY B2 - ReLU FFN. Only change vs B1: GELU -> ReLU.
# ReLU is the classic but has dead-gradient regions (x<0 -> 0 gradient)
# and a non-smooth kink at 0. Question: does the smoother GELU actually
# help at our budget?
# ------------------------------------------------------------------
experiment: B2
label: "ReLU"

# ---- Study A variables held at the canonical baseline ---------------
attention: vanilla
position: learned

# ---- Study B variable ------------------------------------------------
activation: relu
swiglu_matched: true

# ---- Study C variable held at the canonical baseline -----------------
optimizer: adamw

# ---- shared training recipe (identical across all experiments) --------
dropout: 0.0
bias: true
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
warmup_steps: 100
decay_steps: null
eval_interval: 100
eval_iters: 20
checkpoint_interval: 500
sample_interval: 500
seed: 42
