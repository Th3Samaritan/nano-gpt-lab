# ------------------------------------------------------------------
# STUDY B3 - SiLU (Swish) FFN. Only change vs B1: GELU -> SiLU.
# SiLU(x) = x*sigmoid(x): smooth like GELU but non-monotonic (small
# negative lobe). Both are modern defaults; this measures whether the
# difference matters at our budget.
# ------------------------------------------------------------------
experiment: B3
label: "SiLU"

# ---- Study A variables held at the canonical baseline ---------------
attention: vanilla
position: learned

# ---- Study B variable ------------------------------------------------
activation: silu
swiglu_matched: true

# ---- Study C variable held at the canonical baseline -----------------
optimizer: adamw

# ---- shared training recipe (identical across all experiments) --------
dropout: 0.0
bias: true
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
warmup_steps: 100
decay_steps: null
eval_interval: 100
eval_iters: 20
checkpoint_interval: 500
sample_interval: 500
seed: 42
