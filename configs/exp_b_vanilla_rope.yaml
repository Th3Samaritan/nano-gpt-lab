# ------------------------------------------------------------------
# EXPERIMENT B - Vanilla causal attention + RoPE (rotation replaces
# the learned position table).
# ------------------------------------------------------------------
experiment: B
label: "Vanilla + RoPE"

# ---- THE two experimental variables (only these differ A/B/C/D) ----
attention: vanilla
position: rope               # no position table: q/k are rotated
rope_base: 10000.0           # RoFormer's theta base

# ---- Study B/C variables held at the canonical baseline -------------
activation: gelu             # B1 baseline; varies only in the B series
swiglu_matched: true        # SwiGLU fairness: param-matched width
optimizer: adamw             # C2 baseline; varies only in the C series

# ---- shared training recipe (identical across experiments) ---------
dropout: 0.0
bias: true
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
warmup_steps: 100
decay_steps: null
eval_interval: 100
eval_iters: 20
checkpoint_interval: 500
sample_interval: 500
seed: 42
