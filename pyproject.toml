# Minimal project metadata so the lab is importable as a package and testable
# with plain `pytest` from the repository root.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-gpt-lab"
version = "0.1.0"
description = "First-principles NanoGPT->GPT-2 research lab: vanilla/RoPE/flash attention ablation matrix"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
